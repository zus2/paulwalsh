<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Paul Walsh | Full Stack Developer</title>
  <meta name="description"
        content="Paul Walsh — Full Stack Developer. Lake Pukaki, 2016.">
  <meta name="theme-color" content="#001100">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      height: 100%;
      background: #001100;
    }

    body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
    }

    .photograph {
      position: fixed;
      inset: 0;
      margin: 0;
    }

    .photograph img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }

    .photograph figcaption {
      position: absolute;
      top: 0;
      left: 0;
      max-width: 100%;
      margin: 0;
      padding: 16px;
      padding-top: calc(16px + env(safe-area-inset-top, 0px));
      padding-left: calc(16px + env(safe-area-inset-left, 0px));
      padding-right: calc(16px + env(safe-area-inset-right, 0px));
      color: #ccc;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: 0.04em;
    }

    .github-link {
      position: fixed;
      bottom: env(safe-area-inset-bottom, 0px);
      left: env(safe-area-inset-left, 0px);
      padding: 16px;
      color: #ccc;
      font-size: 12px;
      line-height: 1.5;
      text-decoration: none;
    }

    .github-link:hover,
    .github-link:focus-visible {
      text-decoration: underline;
    }

    .github-link:focus-visible {
      outline: 1px solid currentColor;
      outline-offset: -8px;
    }

    @media (min-width: 768px) {
      .github-link {
        padding: 24px;
      }

      .photograph figcaption {
        padding: 24px;
        padding-top: calc(24px + env(safe-area-inset-top, 0px));
        padding-left: calc(24px + env(safe-area-inset-left, 0px));
        padding-right: calc(24px + env(safe-area-inset-right, 0px));
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <main>
    <figure class="photograph">
      <img src="pw-bg.png?v=1"
           alt="Lake Pukaki, photographed in 2016">
      <figcaption>Lake Pukaki 2016</figcaption>
    </figure>
  </main>
  <a class="github-link" href="https://github.com/zus2"
     target="_blank" rel="noopener noreferrer">zus2</a>
</body>
</html>
